<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check-in Details - Completed</title>
    <style>
        :root {
            --white: #ffffff;
            --bg-body: #f1f3f6;
            --gray-light: #f1f3f6;
            --gray-text: #8c8c8c;
            --success-green: #2ecc71; /* Màu xanh lá cho status Completed */
            --success-bg: #4ade80;    /* Màu nền xanh lá cho bảng tính phí */
            --accent-blue: #007bff;   /* Màu xanh dương cho nút Confirm */
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; /* Ngăn chặn lỗi tràn khung khi dùng padding */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }

        body {
            background-color: var(--bg-body);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Khung Modal chính */
        .checkin-card {
            background: var(--white);
            width: 100%;
            max-width: 380px;
            border-radius: 40px; /* Bo góc cực đại đồng bộ với dự án */
            padding: 30px;
            border: 1px solid #e0e0e0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            text-align: center;
        }

        .checkin-card h3 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #000;
        }

        hr { border: 0; border-top: 1px solid #eee; margin-bottom: 25px; }

        /* Các dòng thông tin ngày tháng */
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 18px;
            color: var(--gray-text);
        }

        .info-value {
            color: #333;
            font-weight: 500;
        }

        /* Label trạng thái Completed */
        .status-pill {
            background-color: var(--success-green);
            color: white;
            padding: 5px 25px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }

        /* Bảng tính phí Calculated Fine */
        .fine-section { margin: 25px 0; }
        
        .fine-section h4 {
            font-size: 18px;
            margin-bottom: 15px;
            font-weight: 600;
            color: #000;
        }

        .fine-box {
            background-color: var(--success-bg);
            border-radius: 25px;
            padding: 20px;
        }

        .fine-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 16px;
            font-weight: 600;
            color: #fff; /* Chữ trắng trên nền xanh */
        }

        .fine-divider {
            border-top: 1px solid rgba(255, 255, 255, 0.6);
            margin: 5px 0 10px 0;
        }

        /* Phần Damage & Lost Fees đã sửa lỗi tràn */
        .damage-section {
            margin-top: 25px;
            text-align: center;
        }

        .damage-section p {
            font-size: 18px;
            color: #000;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .damage-input {
            width: 100%; /* Sẽ không bị tràn nhờ box-sizing: border-box */
            background-color: var(--gray-light);
            border: 1px solid #d1d5db;
            padding: 15px 20px;
            border-radius: 30px;
            font-size: 18px;
            color: #333;
            outline: none;
            margin-bottom: 25px;
            display: block;
        }

        /* Nút xác nhận */
        .confirm-btn {
            width: 100%;
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 30px;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

        .confirm-btn:hover { background-color: #0056b3; }
    </style>
</head>
<body>

    <div class="checkin-card">
        <h3>Check-in Details</h3>
        <hr>

        <div class="info-row">
            <span>Date due</span>
            <span class="info-value">1/1/2026</span>
        </div>
        <div class="info-row">
            <span>Day Returned</span>
            <span class="info-value">15/1/2026</span>
        </div>
        <div class="info-row">
            <span>Status</span>
            <span class="status-pill">Completed</span>
        </div>

        <div class="fine-section">
            <h4>Calculated Fine</h4>
            <div class="fine-box">
                <div class="fine-row">
                    <span>Days Overdue</span>
                    <span>0 Days</span>
                </div>
                <div class="fine-row">
                    <span>Fines/day</span>
                    <span>0 VND</span>
                </div>
                <div class="fine-divider"></div>
                <div class="fine-row" style="font-size: 18px;">
                    <span>Total Fines</span>
                    <span>0 VND</span>
                </div>
            </div>
        </div>

        <div class="damage-section">
            <p>Damage & Lost Fees (if any)</p>
            <input type="text" class="damage-input" value="0">
        </div>

        <button class="confirm-btn">Confirm Check-in</button>
    </div>

</body>
</html>
