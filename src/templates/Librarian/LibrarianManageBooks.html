<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management - Manage Books</title>
    <style>
        /* --- Base & Consistency --- */
        :root {
            --bg-body: #f1f3f6;
            --white: #ffffff;
            --gray-text: #8c8c8c;
            --nav-bg: #d1d5db;
            --dark-black: #262626;
            --border-color: #e0e0e0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-body); display: flex; flex-direction: column; align-items: center; padding: 30px; }

        /* Header & Nav (Nhất quán) */
        .header-container {
            background: var(--white); width: 100%; max-width: 1100px; padding: 15px 30px;
            border-radius: 20px; border: 1px solid var(--border-color); display: flex;
            justify-content: space-between; align-items: center; margin-bottom: 30px;
        }
        .logo-box { width: 55px; height: 55px; background: linear-gradient(#ffae3d, #ff7e01); border-radius: 15px; display: flex; justify-content: center; align-items: center; color: white; font-size: 30px; }
        .sign-out-btn { background: var(--dark-black); color: white; border: none; padding: 10px 25px; border-radius: 12px; font-weight: bold; cursor: pointer; }
        
        .nav-bar { background: var(--nav-bg); padding: 5px; border-radius: 40px; display: flex; margin-bottom: 40px; }
        .nav-item { padding: 8px 30px; text-decoration: none; color: #555; font-weight: 500; border-radius: 40px; }
        .nav-item.active { background: white; color: black; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        /* --- Search Row --- */
        .search-row {
            display: flex;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 25px;
        }

        .search-wrapper {
            position: relative;
            flex: 1;
        }

        .search-wrapper input {
            width: 100%;
            padding: 15px 15px 15px 50px;
            border-radius: 25px;
            border: 1px solid #d1d5db;
            background: white;
            font-size: 18px;
            outline: none;
            color: var(--gray-text);
        }

        .search-wrapper svg {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #000;
        }

        .add-btn {
            width: 50px;
            height: 50px;
            background: white;
            border: 1px solid #d1d5db;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            cursor: pointer;
            color: #000;
        }

        /* --- Table Section --- */
        .table-container {
            background: var(--white);
            width: 100%;
            max-width: 1100px;
            border-radius: 35px;
            padding: 20px 30px;
            border: 1px solid var(--border-color);
            min-height: 400px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            color: #555;
            font-weight: 500;
            font-size: 16px;
            padding: 15px 10px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }

        td {
            padding: 15px 10px;
            border-bottom: 1px solid #eee;
            text-align: center;
            font-size: 16px;
            color: #333;
            height: 55px; /* Giữ chiều cao hàng cố định như ảnh mẫu */
        }

        /* Xóa border ở hàng cuối cùng để trông mượt hơn */
        tr:last-child td {
            border-bottom: none;
        }

        /* Căn lề riêng cho cột tiêu đề nếu cần */
        .col-id { width: 60px; }
        .col-status { width: 120px; }

    </style>
</head>
<body>

    <div class="header-container">
        <div class="header-left">
            <div class="logo-box">📖</div>
            <div>
                <h2 style="font-size: 20px;">Library Management System</h2>
                <p style="color: #8c8c8c; font-size: 14px;">Librarian Dashboard</p>
            </div>
        </div>
        <button class="sign-out-btn">Sign out</button>
    </div>

    <div class="nav-bar">
        <a href="#" class="nav-item">Overview</a>
        <a href="#" class="nav-item">Borrowing books</a>
        <a href="#" class="nav-item">Returning books</a>
        <a href="#" class="nav-item active">Manage books</a>
        <a href="#" class="nav-item">Report</a>
    </div>

    <div class="search-row">
        <div class="search-wrapper">
            <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><path d="M21 21l-4.35-4.35"></path></svg>
            <input type="text" placeholder="Find by name or Email">
        </div>
        <div class="add-btn">+</div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th class="col-id">ID</th>
                    <th>Title</th>
                    <th>Author</th>
                    <th>ISBN</th>
                    <th>Category</th>
                    <th>Total</th>
                    <th>Remaining</th>
                    <th class="col-status">Status</th>
                </tr>
            </thead>
            <tbody>
                <tr><td>1</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
                <tr><td>2</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
                <tr><td>3</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
                <tr><td>4</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
                <tr><td>5</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
            </tbody>
        </table>
    </div>

</body>
</html>
