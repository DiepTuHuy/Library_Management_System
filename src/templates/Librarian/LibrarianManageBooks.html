<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management - Manage Books</title>
    <style>
        /* --- Base & Consistency --- */
        :root {
            --bg-body: #f1f3f6;
            --white: #ffffff;
            --gray-text: #8c8c8c;
            --nav-bg: #d1d5db;
            --dark-black: #262626;
            --border-color: #e0e0e0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-body); display: flex; flex-direction: column; align-items: center; padding: 30px; }

        /* Header & Nav (Nhất quán) */
        .header-container {
            background: var(--white); width: 100%; max-width: 1100px; padding: 15px 30px;
            border-radius: 25px; border: 1px solid var(--border-color); display: flex;
            justify-content: space-between; align-items: center; margin-bottom: 30px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-box { width: 55px; height: 55px; background: linear-gradient(#ffae3d, #ff7e01); border-radius: 15px; display: flex; justify-content: center; align-items: center; color: white; font-size: 30px; }
        .sign-out-btn { background: var(--dark-black); color: white; border: none; padding: 10px 25px; border-radius: 12px; font-weight: bold; cursor: pointer; }
        
        .title-group {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .nav-bar { background: var(--nav-bg); padding: 5px; border-radius: 40px; display: flex; margin-bottom: 40px; }
        .nav-item { padding: 8px 30px; text-decoration: none; color: #555; font-weight: 500; border-radius: 40px; }
        .nav-item.active { background: white; color: black; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        /* --- Search Row --- */
        .search-row {
            display: flex;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 25px;
        }

        .search-wrapper {
            position: relative;
            flex: 1;
        }

        .search-wrapper input {
            width: 100%;
            padding: 15px 15px 15px 50px;
            border-radius: 25px;
            border: 1px solid #d1d5db;
            background: white;
            font-size: 18px;
            outline: none;
            color: var(--gray-text);
        }

        .search-wrapper svg {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #000;
        }

        .add-btn {
            width: 50px;
            height: 50px;
            background: white;
            border: 1px solid #d1d5db;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            cursor: pointer;
            color: #000;
            text-decoration: none;
        }

        /* --- Table Section --- */
        .table-container {
            background: var(--white);
            width: 100%;
            max-width: 1100px;
            border-radius: 35px;
            padding: 20px 30px;
            border: 1px solid var(--border-color);
            min-height: 400px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            color: #555;
            font-weight: 500;
            font-size: 16px;
            padding: 15px 10px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }

        td {
            padding: 15px 10px;
            border-bottom: 1px solid #eee;
            text-align: center;
            font-size: 16px;
            color: #333;
            height: 55px; /* Giữ chiều cao hàng cố định như ảnh mẫu */
        }

        /* Xóa border ở hàng cuối cùng để trông mượt hơn */
        tr:last-child td {
            border-bottom: none;
        }

        /* Căn lề riêng cho cột tiêu đề nếu cần */
        .col-id { width: 60px; }
        .col-status { width: 120px; }

        /* --- Modal Overlay --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .add-book-modal {
            background: var(--white);
            width: 100%;
            max-width: 500px;
            border-radius: 40px;
            padding: 30px 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }

        .add-book-modal h3 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 15px;
            color: #000;
        }

        .add-book-modal hr {
            border: 0;
            border-top: 1px solid #eee;
            margin-bottom: 25px;
        }

        /* Form Grid */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px 25px;
            text-align: left;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        .form-group label {
            font-size: 16px;
            font-weight: 500;
            color: var(--gray-text);
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px 20px;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            font-size: 16px;
            outline: none;
            background: var(--white);
            font-family: 'Segoe UI', sans-serif;
        }

        .form-group textarea {
            height: 100px;
            resize: none;
            border-radius: 25px;
        }

        /* Button Group */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }

        .btn-add {
            background-color: var(--accent-blue, #007bff);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 25px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-add:hover {
            opacity: 0.9;
        }

        .btn-cancel {
            background-color: transparent;
            color: #000;
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-cancel:hover {
            background-color: #f0f0f0;
        }

    </style>
</head>
<body>

    <div class="header-container">
        <div class="header-left">
            <div class="logo-box">📖</div>
            <div>
                <h2 style="font-size: 20px;">Library Management System</h2>
                <p style="color: #8c8c8c; font-size: 14px;">Librarian Dashboard</p>
            </div>
        </div>
        <a href="/logout"><button class="sign-out-btn">Sign out</button></a>
    </div>

    <div class="nav-bar">
        <a href="/librarian/dashboard" class="nav-item">Overview</a>
        <a href="/librarian/borrowing-books" class="nav-item">Borrowing books</a>
        <a href="/librarian/returning-books" class="nav-item">Returning books</a>
        <a href="/librarian/manage-books" class="nav-item active">Manage books</a>
        <a href="/librarian/reports/borrow-return" class="nav-item">Report</a>
    </div>

    <div class="search-row">
        <div class="search-wrapper">
            <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><path d="M21 21l-4.35-4.35"></path></svg>
            <input type="text" placeholder="Find by name or Email">
        </div>
        <button class="add-btn" id="openAddBookBtn">+</button>
    </div>

    <!-- Modal Overlay -->
    <div class="modal-overlay" id="addBookModal">
        <div class="add-book-modal">
            <h3>Add new book</h3>
            <hr>

            <form id="addBookForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Title</label>
                        <input type="text" name="title" required>
                    </div>
                    <div class="form-group">
                        <label>Author</label>
                        <input type="text" name="author" required>
                    </div>

                    <div class="form-group">
                        <label>ISBN</label>
                        <input type="text" name="isbn">
                    </div>
                    <div class="form-group">
                        <label>Category</label>
                        <input type="text" name="category" required>
                    </div>

                    <div class="form-group">
                        <label>Year</label>
                        <input type="text" name="year">
                    </div>
                    <div class="form-group">
                        <label>Publisher</label>
                        <input type="text" name="publisher">
                    </div>

                    <div class="form-group">
                        <label>Total Quantity</label>
                        <input type="number" name="quantity" min="1" required>
                    </div>
                    <div class="form-group">
                        <label>Available</label>
                        <input type="number" name="available" min="0" required>
                    </div>

                    <div class="form-group full-width">
                        <label>Description</label>
                        <textarea name="description" placeholder="Enter book description"></textarea>
                    </div>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn-add">Add Book</button>
                    <button type="button" class="btn-cancel" id="closeAddBookBtn">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th class="col-id">ID</th>
                    <th>Title</th>
                    <th>Author</th>
                    <th>ISBN</th>
                    <th>Category</th>
                    <th>Total</th>
                    <th>Remaining</th>
                    <th class="col-status">Status</th>
                </tr>
            </thead>
            <tbody id="booksTableBody">
            </tbody>
        </table>
        <div id="emptyMessage" style="display:none; text-align:center; padding:20px; color:#999;">
            No books found.
        </div>
        
        <!-- Pagination Controls -->
        <div id="paginationControls" style="display: flex; align-items: center; justify-content: center; gap: 20px; margin-top: 25px; padding: 15px 0; border-top: 1px solid #e0e0e0;">
            <button id="prevBtn" onclick="goToPreviousPage()" style="background: none; border: none; cursor: pointer; padding: 8px 12px; font-size: 24px; color: #666; transition: 0.2s;" title="Previous">
                ◄
            </button>
            <span id="pageInfo" style="font-size: 14px; color: #666; min-width: 150px; text-align: center;">Page 1 of 1</span>
            <button id="nextBtn" onclick="goToNextPage()" style="background: none; border: none; cursor: pointer; padding: 8px 12px; font-size: 24px; color: #666; transition: 0.2s;" title="Next">
                ►
            </button>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5000/api';
        const BOOKS_PER_PAGE = 9;
        let allBooks = [];
        let filteredBooks = [];
        let currentPage = 1;
        const modal = document.getElementById('addBookModal');
        const openBtn = document.getElementById('openAddBookBtn');
        const closeBtn = document.getElementById('closeAddBookBtn');
        const form = document.getElementById('addBookForm');

        // Load books on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadBooks();
            setupScrollListener();
            setupModalControls();
        });

        function setupModalControls() {
            // Mở modal
            openBtn.addEventListener('click', function() {
                modal.classList.add('active');
            });

            // Đóng modal
            closeBtn.addEventListener('click', function() {
                modal.classList.remove('active');
                form.reset();
            });

            // Đóng modal khi bấm ngoài modal
            modal.addEventListener('click', function(e) {
                if (e.target === modal) {
                    modal.classList.remove('active');
                    form.reset();
                }
            });

            // Xử lý form submit
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                handleAddBook(e);
            });
        }

        async function loadBooks() {
            try {
                const response = await fetch(`${API_BASE}/books`, {
                    method: 'GET',
                    credentials: 'include',
                    headers: {'Content-Type': 'application/json'}
                });

                if (!response.ok) throw new Error('Failed to load books');

                const data = await response.json();
                if (data.success) {
                    allBooks = data.books || [];
                    filteredBooks = allBooks;
                    currentPage = 1;
                    renderBooks();
                } else {
                    console.error('Failed to load books:', data.message);
                }
            } catch (error) {
                console.error('Error loading books:', error);
                alert('Failed to load books. Make sure backend is running.');
            }
        }

        function renderBooks() {
            const tbody = document.getElementById('booksTableBody');
            const emptyMsg = document.getElementById('emptyMessage');
            
            tbody.innerHTML = '';
            
            if (!filteredBooks || filteredBooks.length === 0) {
                emptyMsg.style.display = 'block';
                return;
            }
            
            emptyMsg.style.display = 'none';
            
            // Calculate pagination
            const totalPages = Math.ceil(filteredBooks.length / BOOKS_PER_PAGE);
            const startIndex = (currentPage - 1) * BOOKS_PER_PAGE;
            const endIndex = Math.min(startIndex + BOOKS_PER_PAGE, filteredBooks.length);
            const paginatedBooks = filteredBooks.slice(startIndex, endIndex);
            
            // Render books with IDs from database
            paginatedBooks.forEach((book) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${book.book_id}</td>
                    <td>${book.title}</td>
                    <td>${book.author}</td>
                    <td>${book.isbn}</td>
                    <td>${book.category}</td>
                    <td>${book.quantity}</td>
                    <td>${book.available_quantity}</td>
                    <td><span style="color: ${book.status === 'Available' ? 'green' : 'red'}">${book.status}</span></td>
                `;
                tbody.appendChild(row);
            });
            
            // Update pagination info and buttons
            updatePaginationInfo(totalPages);
            updatePaginationButtons();
        }

        function updatePaginationInfo(totalPages) {
            let paginationContainer = document.getElementById('paginationInfo');
            
            if (!paginationContainer) {
                paginationContainer = document.createElement('div');
                paginationContainer.id = 'paginationInfo';
                paginationContainer.style.cssText = 'text-align: center; margin-top: 15px; padding: 10px; color: #666; font-size: 14px;';
                const table = document.querySelector('table');
                table.parentNode.insertBefore(paginationContainer, table.nextSibling);
            }
            
            const startItem = (currentPage - 1) * BOOKS_PER_PAGE + 1;
            const endItem = Math.min(currentPage * BOOKS_PER_PAGE, filteredBooks.length);
            paginationContainer.innerHTML = `Showing ${startItem}-${endItem} of ${filteredBooks.length} | Page ${currentPage} of ${totalPages}`;
        }

        function setupScrollListener() {
            // Scroll listener removed - Using manual pagination buttons only
        }

        function searchBooks() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            
            if (!query) {
                filteredBooks = allBooks;
            } else {
                filteredBooks = allBooks.filter(book => 
                    book.title.toLowerCase().includes(query) ||
                    book.author.toLowerCase().includes(query) ||
                    book.category.toLowerCase().includes(query) ||
                    book.isbn.toLowerCase().includes(query)
                );
            }
            
            currentPage = 1;
            renderBooks();
        }

        async function handleAddBook(event) {
            event.preventDefault();
            
            const formData = new FormData(form);
            const bookData = {
                title: formData.get('title'),
                author: formData.get('author'),
                isbn: formData.get('isbn'),
                category: formData.get('category'),
                year: formData.get('year'),
                publisher: formData.get('publisher'),
                quantity: parseInt(formData.get('quantity')),
                available_quantity: parseInt(formData.get('available')),
                description: formData.get('description')
            };

            try {
                const response = await fetch(`${API_BASE}/books`, {
                    method: 'POST',
                    credentials: 'include',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(bookData)
                });

                const data = await response.json();
                
                if (data.success) {
                    alert('Book added successfully!');
                    form.reset();
                    modal.classList.remove('active');
                    loadBooks();
                } else {
                    alert('Error: ' + data.message);
                }
            } catch (error) {
                console.error('Error adding book:', error);
                alert('Failed to add book. Make sure backend is running.');
            }
        }

        function goToNextPage() {
            const totalPages = Math.ceil(filteredBooks.length / BOOKS_PER_PAGE);
            if (currentPage < totalPages) {
                currentPage++;
                renderBooks();
                updatePaginationButtons();
            }
        }

        function goToPreviousPage() {
            if (currentPage > 1) {
                currentPage--;
                renderBooks();
                updatePaginationButtons();
            }
        }

        function updatePaginationButtons() {
            const totalPages = Math.ceil(filteredBooks.length / BOOKS_PER_PAGE);
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const pageInfo = document.getElementById('pageInfo');
            
            // Update page info
            pageInfo.textContent = `Page ${currentPage} of ${totalPages}`;
            
            // Disable/Enable previous button
            if (currentPage === 1) {
                prevBtn.disabled = true;
                prevBtn.style.color = '#ccc';
                prevBtn.style.cursor = 'not-allowed';
            } else {
                prevBtn.disabled = false;
                prevBtn.style.color = '#666';
                prevBtn.style.cursor = 'pointer';
            }
            
            // Disable/Enable next button
            if (currentPage >= totalPages) {
                nextBtn.disabled = true;
                nextBtn.style.color = '#ccc';
                nextBtn.style.cursor = 'not-allowed';
            } else {
                nextBtn.disabled = false;
                nextBtn.style.color = '#666';
                nextBtn.style.cursor = 'pointer';
            }
        }
    </script>
