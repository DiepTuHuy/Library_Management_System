<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management - Borrowing Books</title>
    <style>
        :root {
            --bg-body: #f1f3f6;
            --white: #ffffff;
            --gray-text: #8c8c8c;
            --dark-text: #262626;
            --accent-blue: #007bff;
            --nav-bg: #d1d5db;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

        body { background-color: var(--bg-body); display: flex; flex-direction: column; align-items: center; padding: 30px; }

        /* --- Header & Nav (Giữ nguyên từ Dashboard) --- */
        .header-container {
            background: white;
            width: 100%;
            max-width: 1100px;
            padding: 15px 30px;
            border-radius: 25px; /* Bo góc lớn cho khung header */
            border: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .logo-box { width: 55px; height: 55px; background: linear-gradient(#ffae3d, #ff7e01); border-radius: 15px; display: flex; justify-content: center; align-items: center; color: white; font-size: 30px; }
        .sign-out-btn { background: #262626; color: white; border: none; padding: 10px 25px; border-radius: 12px; font-weight: bold; cursor: pointer; }
        
        .title-group {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .nav-bar { background: var(--nav-bg); padding: 5px; border-radius: 40px; display: flex; margin-bottom: 40px; }
        .nav-item { padding: 8px 30px; text-decoration: none; color: #555; font-weight: 500; border-radius: 40px; }
        .nav-item.active { background: white; color: black; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        /* --- Main Content Layout --- */
        .main-content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 25px;
            width: 100%;
            max-width: 1100px;
        }

        /* --- Search Sections --- */
        .search-card {
            background: var(--white);
            padding: 25px 35px;
            border-radius: 30px;
            border: 1px solid #e0e0e0;
            margin-bottom: 25px;
        }

        .search-card label {
            display: block;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 15px;
            color: #000;
        }

        .input-group {
            position: relative;
            width: 100%;
        }

        .input-group input {
            width: 100%;
            padding: 15px 15px 15px 50px;
            border-radius: 25px;
            border: 1px solid #d1d5db;
            font-size: 16px;
            color: #8c8c8c;
            outline: none;
        }

        .input-group svg {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #262626;
        }

        /* --- Checkout Details Card --- */
        .details-card {
            background: var(--white);
            padding: 30px;
            border-radius: 30px;
            border: 1px solid #e0e0e0;
            text-align: center;
        }

        .details-card h3 {
            font-size: 18px;
            margin-bottom: 25px;
        }

        .day-input-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .day-box {
            background: #f1f3f6;
            padding: 10px 25px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 20px;
            width: 150px;
            text-align: center;
            border: none;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 16px;
            color: var(--gray-text);
        }

        .info-value { color: #555; font-weight: 500; }

        .confirm-btn {
            width: 100%;
            background: #007bff;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        hr { border: 0; border-top: 1px solid #eee; margin: 20px 0; }
    </style>
</head>
<body>

    <div class="header-container">
        <div class="header-left">
            <div class="logo-box">
                <img src="https://daisy.org/wp-content/uploads/2020/07/apple-books-app-icon.png" alt="Library Logo" class="logo-box"/>
            </div>
            <div class="title-group">
                <h2 style="font-size: 20px; margin: 0;">Library Management System</h2>
                <p style="color: #8c8c8c; font-size: 14px; margin: 0;">Librarian Dashboard</p>
            </div>
        </div>
        <a href="/logout"><button class="sign-out-btn">Sign out</button></a>
    </div>

    <div class="nav-bar">
        <a href="/librarian/dashboard" class="nav-item">Overview</a>
        <a href="/librarian/borrowing-books" class="nav-item active">Borrowing books</a>
        <a href="/librarian/returning-books" class="nav-item">Returning books</a>
        <a href="/librarian/manage-books" class="nav-item">Manage books</a>
        <a href="/librarian/reports/borrow-return" class="nav-item">Report</a>
    </div>

    <div class="main-content">
        <div class="search-section">
            <div class="search-card">
                <label>Search Member</label>
                <div class="input-group">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><path d="M21 21l-4.35-4.35"></path></svg>
                    <input type="text" placeholder="Search by ID member or name,...">
                </div>
            </div>

            <div class="search-card">
                <label>Search Books</label>
                <div class="input-group">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><path d="M21 21l-4.35-4.35"></path></svg>
                    <input type="text" placeholder="Search by name, title, or ISBN">
                </div>
            </div>
        </div>

        <div class="details-card">
            <h3>Checkout Details</h3>
            <hr>
            <div class="day-input-row">
                <input type="text" class="day-box" value="14">
                <span style="font-weight: bold; font-size: 18px;">days</span>
            </div>
            
            <div class="info-row">
                <span>Day Borrowed</span>
                <span class="info-value">1/1/2026</span>
            </div>
            <div class="info-row">
                <span>Day Returned</span>
                <span class="info-value">15/1/2026</span>
            </div>
            <div class="info-row">
                <span>Quantity</span>
                <span class="info-value">0</span>
            </div>
            
            <button class="confirm-btn">Confirm Check-out</button>
        </div>
    </div>

</body>
</html>
