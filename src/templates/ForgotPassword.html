
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Library System - Forgot Password</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            height: 100vh;
            background: #f0f2f5; /* Màu nền tối đồng bộ với hệ thống */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .forgot-card {
            background: #ffffff;
            width: 400px;
            border-radius: 30px;
            padding: 40px 30px;
            position: relative;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        /* Logo nằm đè lên mép trên */
        .logo-wrapper {
            width: 100px;              /* Kích thước ảnh */
            height: 100px;
            object-fit: cover;         /* Giữ tỉ lệ ảnh không bị méo */
            
            /* === 1. KỸ THUẬT ĐÈ LÊN VIỀN === */
            /* Padding-top của card đang là 50px. 
            Muốn ảnh trồi lên hẳn, ta dùng margin âm lớn hơn padding */
            margin-top: -100px;        
            margin-bottom: 20px;       /* Đẩy tiêu đề H1 xuống một chút */
            
            /* Canh giữa ảnh */
            display: block;
            margin-left: auto;
            margin-right: auto;

            /* === 2. BO GÓC === */
            border-radius: 25px;       /* Bo góc vuông (muốn tròn vo thì để 50%) */
            
            /* Tạo bóng để ảnh tách biệt khỏi nền xám phía sau */
            box-shadow: 0 10px 20px rgba(0,0,0,0.15); 
            background-color: #fff;    /* Đề phòng ảnh PNG trong suốt */
        }

        h2 {
            margin: 40px 0 30px 0;
            font-size: 22px;
            color: #333;
        }

        /* Style cho các ô nhập liệu */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .input-item {
            width: 100%;
            padding: 14px 20px;
            border-radius: 30px;
            border: 1px solid transparent;
            background: #f1f1f7;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        .input-item:focus {
            border-color: #007aff;
            background: #fff;
        }

        /* Nút bấm */
        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 30px;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-change {
            background: #007aff;
            color: white;
            margin-bottom: 12px;
        }

        .btn-change:hover {
            background: #0056b3;
        }

        .btn-cancel {
            background: #f1f1f7;
            color: #555;
        }

        .btn-cancel:hover {
            background: #e2e2e9;
        }

    </style>
</head>
<body>

<div class="forgot-card">
    <div class="logo-wrapper">
        <img src="https://daisy.org/wp-content/uploads/2020/07/apple-books-app-icon.png" alt="Library Logo" class="logo-wrapper"s/>
    </div>

    <h2>Library Management System</h2>

    <div class="input-group">
        <input type="password" class="input-item" placeholder="New Password">
        <input type="password" class="input-item" placeholder="Confirm Password">
        <input type="text" class="input-item" placeholder="Phone number or Email">
        <input type="text" class="input-item" placeholder="Enter OTP Code">
    </div>

    <button class="btn btn-change">Change Password</button>
    
    <a href="/login">
    <button class="btn btn-cancel">Cancel</button>
    </a>
</div>

</body>
</html>
