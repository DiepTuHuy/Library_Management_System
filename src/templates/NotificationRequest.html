

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Successful</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', system-ui, sans-serif;
        }

        body {
            background-color: rgba(0, 0, 0, 0.4);
            color: #111;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Modal Container */
        .modal-container {
            background-color: #ffffff;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            text-align: center;
        }

        /* Modal Content */
        .modal-content {
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Success Icon */
        .success-icon {
            width: 80px;
            height: 80px;
            background-color: #4CAF50;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
        }

        .success-icon::before {
            content: "✓";
            color: white;
            font-size: 40px;
            font-weight: bold;
        }

        /* Success Message */
        .success-message {
            font-size: 24px;
            font-weight: 600;
            color: #111;
            margin-bottom: 30px;
        }

        /* Continue Button */
        .continue-btn {
            background-color: #111;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 16px 40px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
            max-width: 200px;
        }

        .continue-btn:hover {
            background-color: #333;
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            .modal-container {
                max-width: 100%;
            }
            
            .modal-content {
                padding: 30px 20px;
            }
            
            .success-icon {
                width: 70px;
                height: 70px;
            }
            
            .success-icon::before {
                font-size: 35px;
            }
            
            .success-message {
                font-size: 20px;
            }
            
            .continue-btn {
                padding: 14px 30px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="modal-container">
        <div class="modal-content">
            <!-- Success Icon -->
            <div class="success-icon"></div>
            
            <!-- Success Message -->
            <div class="success-message">Request Successful</div>
            
            <!-- Continue Button -->
            <button class="continue-btn">Continue</button>
        </div>
    </div>
</body>
</html>
