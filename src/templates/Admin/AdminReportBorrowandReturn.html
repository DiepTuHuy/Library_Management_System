<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management - Report</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-body: #f1f3f6;
            --white: #ffffff;
            --gray-text: #8c8c8c;
            --nav-bg: #d1d5db;
            --accent-blue: #007bff;
            --accent-green: #2ecc71;
            --dark-black: #262626;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-body); display: flex; flex-direction: column; align-items: center; padding: 20px; }

        /* Header & Nav (Đồng nhất UI) */
        .header-container {
            background: var(--white); width: 100%; max-width: 1100px; padding: 15px 30px;
            border-radius: 20px; border: 1px solid #e0e0e0; display: flex;
            justify-content: space-between; align-items: center; margin-bottom: 25px;
        }
        .logo-box { width: 55px; height: 55px; background: linear-gradient(#ffae3d, #ff7e01); border-radius: 15px; display: flex; justify-content: center; align-items: center; color: white; font-size: 30px; }
        .sign-out-btn { background: var(--dark-black); color: white; border: none; padding: 10px 25px; border-radius: 12px; font-weight: bold; cursor: pointer; }
        
        .nav-bar { background: var(--nav-bg); padding: 5px; border-radius: 40px; display: flex; margin-bottom: 30px; }
        .nav-item { padding: 8px 30px; text-decoration: none; color: #555; font-weight: 500; border-radius: 40px; }
        .nav-item.active { background: white; color: black; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        /* --- Stats Row --- */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 25px;
        }

        .stat-small-card {
            background: var(--white);
            padding: 20px;
            border-radius: 25px;
            border: 1px solid #e0e0e0;
        }

        .stat-small-card h4 { font-size: 16px; color: #000; margin-bottom: 10px; }
        .stat-small-card p { font-size: 14px; color: var(--gray-text); }

        /* --- Main Report Content --- */
        .report-main-grid {
            display: grid;
            grid-template-columns: 220px 1fr;
            gap: 25px;
            width: 100%;
            max-width: 1100px;
        }

        /* Sidebar Menu */
        .report-sidebar {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .side-btn {
            background: var(--white);
            border: 1px solid #e0e0e0;
            padding: 15px;
            border-radius: 20px;
            text-align: center;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            color: #555;
            transition: 0.2s;
        }

        .side-btn.active {
            background: var(--accent-blue);
            color: white;
            border-color: var(--accent-blue);
        }

        /* Chart Container */
        .chart-container {
            background: var(--white);
            border-radius: 30px;
            padding: 30px;
            border: 1px solid #e0e0e0;
            text-align: center;
        }

        .chart-container h3 { margin-bottom: 20px; font-size: 18px; }
        canvas { max-height: 350px; width: 100% !important; }

    </style>
</head>
<body>

    <div class="header-container">
        <div class="header-left">
            <div class="logo-box">📖</div>
            <div>
                <h2 style="font-size: 20px;">Library Management System</h2>
                <p style="color: #8c8c8c; font-size: 14px;">Admin Dashboard</p>
            </div>
        </div>
        <button class="sign-out-btn">Sign out</button>
    </div>

    <div class="nav-bar">
        <a href="AdminOverview.html" class="nav-item">Overview</a>
        <a href="AdminManageUser.html" class="nav-item">Manage User</a>
        <a href="AdminManageBook.html" class="nav-item">Manage Books</a>
        <a href="AdminReportBorrowandReturn.html" class="nav-item active">Reports</a>
    </div>

    <div class="stats-row">
        <div class="stat-small-card"><h4>Borrows This Month</h4><p>200</p></div>
        <div class="stat-small-card"><h4>Returns This Month</h4><p>500</p></div>
        <div class="stat-small-card"><h4>Late</h4><p>50</p></div>
        <div class="stat-small-card"><h4>Fines Collected</h4><p>12</p></div>
    </div>

    <div class="report-main-grid">
        <div class="report-sidebar">
            <a href="AdminReportBorrowandReturn.html" class="side-btn active">Borrow / return</a>
            <a href="AdminReportCategory.html" class="side-btn">Category</a>
            <a href="AdminReportTopBook.html" class="side-btn">Top Books</a>
            <a href="AdminReportLate.html" class="side-btn">Late</a>
        </div>

        <div class="chart-container">
            <h3>Books borrowing and returning chart</h3>
            <canvas id="reportChart"></canvas>
        </div>
    </div>

    <script>
        const ctx = document.getElementById('reportChart').getContext('2d');
        const reportChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['T7', 'T8', 'T9', 'T10', 'T11', 'T12'],
                datasets: [
                    {
                        label: 'Books Borrow',
                        data: [180, 320, 280, 440, 380, 220],
                        backgroundColor: '#007bff',
                        borderRadius: 5,
                    },
                    {
                        label: 'Books Return',
                        data: [100, 350, 210, 390, 330, 520],
                        backgroundColor: '#2ecc71',
                        borderRadius: 5,
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: true,
                        max: 600,
                        ticks: { stepSize: 100 }
                    },
                    x: {
                        grid: { display: false }
                    }
                },
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: { usePointStyle: true, padding: 20 }
                    }
                }
            }
        });
    </script>
</body>
</html>
