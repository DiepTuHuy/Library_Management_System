<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management - Admin Manage Books</title>

    <style>
        :root {
            --bg-body: #f1f3f6;
            --white: #ffffff;
            --gray-text: #8c8c8c;
            --nav-bg: #d1d5db;
            --dark-black: #262626;
            --border-color: #e0e0e0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* ===== Header ===== */
        .header-container {
            background: var(--white);
            width: 100%;
            max-width: 1100px;
            padding: 15px 30px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header-left {
            display: flex;
            align-items: center;
        }

        .logo-box {
            width: 55px;
            height: 55px;
            background: linear-gradient(#ffae3d, #ff7e01);
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 30px;
        }

        .sign-out-btn {
            background: var(--dark-black);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        /* ===== Navigation ===== */
        .nav-bar {
            background: var(--nav-bg);
            padding: 5px;
            border-radius: 40px;
            display: flex;
            margin-bottom: 40px;
        }

        .nav-item {
            padding: 10px 35px;
            text-decoration: none;
            color: #555;
            font-weight: 500;
            border-radius: 40px;
        }

        .nav-item.active {
            background: white;
            color: black;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* ===== Action Row ===== */
        .action-row {
            display: flex;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 25px;
        }

        .search-container {
            position: relative;
            flex: 1;
        }

        .search-container input {
            width: 100%;
            padding: 15px 15px 15px 55px;
            border-radius: 25px;
            border: 1px solid #d1d5db;
            background: white;
            font-size: 18px;
            outline: none;
            color: var(--gray-text);
        }

        .search-container svg {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
        }

        .add-circle-btn {
            width: 50px;
            height: 50px;
            background: white;
            border: 1px solid #d1d5db;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            cursor: pointer;
            user-select: none;
        }

        /* ===== Table ===== */
        .table-box {
            background: var(--white);
            width: 100%;
            max-width: 1100px;
            border-radius: 40px;
            padding: 20px 35px;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            font-size: 17px;
            padding: 18px 10px;
            border-bottom: 1px solid #eee;
            text-align: left;
        }

        td {
            padding: 16px 10px;
            border-bottom: 1px solid #eee;
            height: 58px;
        }

        /* ===== Overlay Add Book ===== */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-box {
            width: 520px;
            border-radius: 40px;
            overflow: hidden;
            background: white;
        }

        .modal-box iframe {
            width: 100%;
            height: 620px;
            border: none;
        }
    </style>
</head>

<body>

    <!-- Header -->
    <div class="header-container">
        <div class="header-left">
            <div class="logo-box">📖</div>
            <div style="margin-left: 15px;">
                <h2>Library Management System</h2>
                <p style="color:#8c8c8c;">Admin Dashboard</p>
            </div>
        </div>
        <button class="sign-out-btn">Sign out</button>
    </div>

    <!-- Navigation -->
    <div class="nav-bar">
        <a href="AdminOverview.html" class="nav-item">Overview</a>
        <a href="AdminManageUser.html" class="nav-item">Manage User</a>
        <a href="AdminManageBook.html" class="nav-item active">Manage Books</a>
        <a href="AdminReportBorrowandReturn.html" class="nav-item">Reports</a>
    </div>

    <!-- Search + Add -->
    <div class="action-row">
        <div class="search-container">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="M21 21l-4.35-4.35"></path>
            </svg>
            <input type="text" placeholder="Find by name or Email">
        </div>

        <!-- FIX: mở modal -->
        <div class="add-circle-btn" onclick="openModal()">+</div>
    </div>

    <!-- Table -->
    <div class="table-box">
        <table>
            <thead>
                <tr>
                    <th>ID</th><th>Title</th><th>Author</th><th>ISBN</th>
                    <th>Category</th><th>Total</th><th>Remaining</th><th>Status</th>
                </tr>
            </thead>
            <tbody>
                <tr><td>1</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
                <tr><td>2</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
            </tbody>
        </table>
    </div>

    <!-- ===== Overlay ===== -->
    <div id="overlay" class="overlay" onclick="closeModal()">
        <div class="modal-box" onclick="event.stopPropagation()">
            <iframe src="AdminAddBook.html"></iframe>
        </div>
    </div>

    <script>
        function openModal() {
            document.getElementById("overlay").style.display = "flex";
        }
        function closeModal() {
            document.getElementById("overlay").style.display = "none";
        }
    </script>

</body>
</html>
