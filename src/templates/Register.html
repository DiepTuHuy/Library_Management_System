

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System - Register</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .register-card {
            background: white;
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            position: relative;
        }

        /* Logo Icon positioned at the top */
        .logo-container {
            width: 100px;              /* Kích thước ảnh */
            height: 100px;
            object-fit: cover;         /* Giữ tỉ lệ ảnh không bị méo */
            
            margin-top: -100px;
            margin-bottom: 20px;
            
            /* Canh giữa ảnh */
            display: block;
            margin-left: auto;
            margin-right: auto;

            /* === 2. BO GÓC === */
            border-radius: 25px;       /* Bo góc vuông (muốn tròn vo thì để 50%) */
            
        }

        .logo-container span {
            font-size: 35px;
            color: white;
        }

        h1 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 30px;
            color: #1c1c1e;
        }

        /* Form styling */
        .form-group {
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 15px 20px;
            border-radius: 15px;
            border: none;
            background-color: #f2f2f7;
            font-size: 15px;
            color: #1c1c1e;
            outline: none;
            text-align: center;
        }

        input::placeholder {
            color: #8e8e93;
        }

        /* Button styling */
        .btn {
            width: 100%;
            padding: 15px;
            border-radius: 15px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s;
        }

        .btn-register {
            background-color: #007aff;
            color: white;
            margin-top: 25px;
        }

        .btn-cancel {
            background-color: #f2f2f7;
            color: #1c1c1e;
        }

        .btn:active {
            opacity: 0.8;
        }

        /* Alert styling */
        .alert {
            padding: 12px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
        }

        .alert.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #007aff;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="register-card">
        <img src="https://daisy.org/wp-content/uploads/2020/07/apple-books-app-icon.png" alt="Library Logo" class="logo-container">
        <div class="logo-container">
        </div>

        <h1>Library Management System</h1>

        <div id="alertContainer"></div>

        <div id="loadingContainer" class="loading">
            <div class="spinner"></div>
        </div>

        <form id="registerForm">
            <div class="form-group">
                <input type="text" id="fullName" placeholder="Full Name" required>
            </div>
            <div class="form-group">
                <input type="email" id="email" placeholder="Email Address" required>
            </div>
            <div class="form-group">
                <input type="password" id="password" placeholder="Create Password" required>
            </div>
            <div class="form-group">
                <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
            </div>

            <button type="submit" class="btn btn-register">Register</button>
            <button type="button" class="btn btn-cancel" onclick="window.location.href='/login'">Cancel</button>
        </form>

        <p style="margin-top: 15px; font-size: 14px; color: #666;">
            Already have an account? <a href="/login" style="color: #007aff; text-decoration: none; font-weight: 600;">Login here</a>
        </p>
    </div>

    <script>
        const API_BASE = 'http://localhost:5000/api';

        function showAlert(message, type = 'info') {
            const container = document.getElementById('alertContainer');
            const alert = document.createElement('div');
            alert.className = `alert ${type}`;
            alert.textContent = message;
            container.innerHTML = '';
            container.appendChild(alert);

            if (type === 'success') {
                setTimeout(() => {
                    window.location.href = 'Login.html';
                }, 2000);
            }
        }

        function showLoading(show = true) {
            document.getElementById('loadingContainer').style.display = show ? 'block' : 'none';
        }

        async function handleRegister(event) {
            event.preventDefault();

            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Validation
            if (!fullName || !email || !password || !confirmPassword) {
                showAlert('❌ All fields are required', 'error');
                return;
            }

            if (fullName.length < 3) {
                showAlert('❌ Full name must be at least 3 characters', 'error');
                return;
            }

            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                showAlert('❌ Invalid email address', 'error');
                return;
            }

            if (password.length < 6) {
                showAlert('❌ Password must be at least 6 characters', 'error');
                return;
            }

            // Check for at least one uppercase letter
            if (!/[A-Z]/.test(password)) {
                showAlert('❌ Password must contain at least 1 uppercase letter', 'error');
                return;
            }

            if (password !== confirmPassword) {
                showAlert('❌ Passwords do not match', 'error');
                return;
            }

            showLoading(true);

            try {
                const response = await fetch(`${API_BASE}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: fullName,
                        email: email,
                        password: password
                    })
                });

                const result = await response.json();
                showLoading(false);

                if (result.success) {
                    showAlert('✓ Registration successful! Redirecting to login...', 'success');
                } else {
                    showAlert(`❌ ${result.message}`, 'error');
                }
            } catch (error) {
                showLoading(false);
                // If API call fails, save to localStorage as fallback
                const users = JSON.parse(localStorage.getItem('registeredUsers') || '{}');
                
                // Check if email already exists
                if (users[email]) {
                    showAlert('❌ Email already registered', 'error');
                    return;
                }
                
                // Save user to localStorage
                users[email] = {
                    name: fullName,
                    email: email,
                    password: password,
                    registeredAt: new Date().toISOString()
                };
                
                localStorage.setItem('registeredUsers', JSON.stringify(users));
                showAlert('✓ Registration successful! Redirecting to login...', 'success');
            }
        }

        document.getElementById('registerForm').addEventListener('submit', handleRegister);
    </script>

</body>
</html>
