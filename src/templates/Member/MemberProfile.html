<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management - Member Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-body: #f1f3f6;
            --white: #ffffff;
            --gray-text: #8c8c8c;
            --nav-bg: #d1d5db;
            --dark-black: #262626;
            --border-color: #e0e0e0;
            --input-bg: #f3f4f6;
            --success-green: #2ecc71;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-body); display: flex; flex-direction: column; align-items: center; padding: 20px; }

        /* Header (Đồng nhất UI) */
        .header-container {
            background: var(--white); width: 100%; max-width: 1150px; padding: 15px 30px;
            border-radius: 20px; border: 1px solid var(--border-color); display: flex;
            justify-content: space-between; align-items: center; margin-bottom: 25px;
        }
        .logo-box { width: 55px; height: 55px; background: linear-gradient(#ffae3d, #ff7e01); border-radius: 15px; display: flex; justify-content: center; align-items: center; color: white; font-size: 30px; }
        .sign-out-btn { background: var(--dark-black); color: white; border: none; padding: 10px 25px; border-radius: 12px; font-weight: bold; cursor: pointer; }
        
        /* Navigation */
        .nav-bar { background: var(--nav-bg); padding: 5px; border-radius: 40px; display: flex; margin-bottom: 30px; }
        .nav-item { padding: 10px 35px; text-decoration: none; color: #555; font-weight: 500; border-radius: 40px; }
        .nav-item.active { background: white; color: black; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        /* Main Layout */
        .profile-grid {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 25px;
            width: 100%;
            max-width: 1150px;
        }

        /* Khối chung */
        .content-box {
            background: var(--white);
            border-radius: 40px;
            border: 1px solid var(--border-color);
            padding: 35px;
        }

        /* --- CỘT TRÁI: THÔNG TIN CHI TIẾT --- */
        .profile-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .user-info-main { display: flex; align-items: center; gap: 20px; }
        .avatar-circle {
            width: 80px; height: 80px;
            background: #e5e7eb; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 40px; color: #9ca3af; position: relative;
        }
        .status-dot {
            width: 15px; height: 15px; background: var(--success-green);
            border: 3px solid white; border-radius: 50%;
            position: absolute; bottom: 5px; right: 5px;
        }

        .edit-btn {
            background: white; border: 1px solid var(--border-color);
            padding: 10px 25px; border-radius: 30px;
            font-weight: 600; cursor: pointer;
        }

        .info-form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px 40px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .input-item {
            background: var(--input-bg);
            padding: 15px 25px;
            border-radius: 30px;
            color: var(--gray-text);
            font-size: 16px;
        }

        /* --- CỘT PHẢI: MOST VIEWED --- */
        .sidebar-header {
            display: flex; align-items: center; gap: 15px; margin-bottom: 25px;
        }
        .sidebar-header .avatar-small {
            width: 50px; height: 50px; background: #e5e7eb; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; font-size: 24px;
        }

        .view-section h3 {
            text-align: center; font-size: 20px; margin-bottom: 30px;
            border-top: 1px solid #eee; padding-top: 20px;
        }

        .book-list-mini {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .book-item-mini { text-align: center; }
        .book-thumb {
            width: 100%; aspect-ratio: 1/1;
            background: white; border: 1px solid #eee;
            border-radius: 20px; position: relative; margin-bottom: 10px;
        }
        .mini-tag {
            position: absolute; top: 8px; right: 8px;
            width: 18px; height: 18px;
            background: linear-gradient(#ffae3d, #ff7e01);
            border-radius: 4px; color: white; font-size: 10px;
            display: flex; justify-content: center; align-items: center;
        }
        .book-item-mini span { font-size: 14px; font-weight: 600; }

    </style>
</head>
<body>

    <div class="header-container">
        <div class="header-left" style="display: flex; align-items: center;">
            <div class="logo-box">📖</div>
            <div style="margin-left: 15px;">
                <h2 style="font-size: 20px;">Library Management System</h2>
                <p style="color: #8c8c8c; font-size: 14px;">Member Dashboard</p>
            </div>
        </div>
        <button class="sign-out-btn">Sign out</button>
    </div>

    <div class="nav-bar">
        <a href="#" class="nav-item">Overview</a>
        <a href="#" class="nav-item">Browse library</a>
        <a href="#" class="nav-item">My books</a>
        <a href="#" class="nav-item active">Profile</a>
    </div>

    <div class="profile-grid">
        <div class="content-box">
            <div class="profile-header">
                <div class="user-info-main">
                    <div class="avatar-circle">
                        <i class="fa-solid fa-user"></i>
                        <div class="status-dot"></div>
                    </div>
                    <div>
                        <h2 style="font-size: 22px;">User Name</h2>
                        <p style="color: var(--gray-text);">Email</p>
                    </div>
                </div>
                <button class="edit-btn">Edit Profile</button>
            </div>

            <div class="info-form-grid">
                <div class="input-item">Full Name</div>
                <div class="input-item">Date Joined</div>
                <div class="input-item">Address</div>
                <div class="input-item">MemberID</div>
                <div class="input-item">Gmail</div>
                <div class="input-item">Gender</div>
                <div class="input-item">Phone Number</div>
                <div class="input-item">DateOfBirth</div>
            </div>
        </div>

        <div class="content-box" style="padding: 25px;">
            <div class="sidebar-header">
                <div class="avatar-small"><i class="fa-solid fa-user"></i></div>
                <div>
                    <h4 style="font-size: 16px;">User Name</h4>
                    <p style="font-size: 13px; color: var(--gray-text);">Email</p>
                </div>
            </div>

            <div class="view-section">
                <h3>Most Viewed</h3>
                <div class="book-list-mini">
                    <div class="book-item-mini">
                        <div class="book-thumb"><div class="mini-tag">📖</div></div>
                        <span>Book 1</span>
                    </div>
                    <div class="book-item-mini">
                        <div class="book-thumb"><div class="mini-tag">📖</div></div>
                        <span>Book 3</span>
                    </div>
                    <div class="book-item-mini">
                        <div class="book-thumb"><div class="mini-tag">📖</div></div>
                        <span>Book 2</span>
                    </div>
                    <div class="book-item-mini">
                        <div class="book-thumb"><div class="mini-tag">📖</div></div>
                        <span>Book 4</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
