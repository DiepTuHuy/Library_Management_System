<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management - My Books</title>
    <style>
        :root {
            --bg-body: #f1f3f6;
            --white: #ffffff;
            --gray-text: #8c8c8c;
            --nav-bg: #d1d5db;
            --dark-black: #262626;
            --border-color: #e0e0e0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-body); display: flex; flex-direction: column; align-items: center; padding: 20px; }

        /* Header */
        .header-container {
            background: var(--white); width: 100%; max-width: 1100px; padding: 15px 30px;
            border-radius: 20px; border: 1px solid var(--border-color); display: flex;
            justify-content: space-between; align-items: center; margin-bottom: 25px;
        }

        .header-left{
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .logo-box { width: 55px; height: 55px; background: linear-gradient(#ffae3d, #ff7e01); border-radius: 15px; display: flex; justify-content: center; align-items: center; color: white; font-size: 30px; }
        .sign-out-btn { background: var(--dark-black); color: white; border: none; padding: 10px 25px; border-radius: 12px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; }
        
        /* Navigation Member */
        .nav-bar { background: var(--nav-bg); padding: 5px; border-radius: 40px; display: flex; margin-bottom: 30px; }
        .nav-item { padding: 10px 35px; text-decoration: none; color: #555; font-weight: 500; border-radius: 40px; }
        .nav-item.active { background: white; color: black; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        /* Main Content Layout - CHỈNH SỬA TẠI ĐÂY */
        .my-books-grid {
            display: grid;
            grid-template-columns: 1.8fr 1.2fr;
            gap: 25px;
            width: 100%;
            max-width: 1100px;
            align-items: stretch; /* Giúp 2 khung luôn có chiều cao bằng nhau */
        }

        /* Khối nội dung trắng */
        .books-section {
            background: var(--white);
            border-radius: 40px;
            padding: 30px;
            border: 1px solid var(--border-color);
            text-align: center;
            display: flex; /* Sử dụng flex để quản lý nội dung bên trong */
            flex-direction: column;
        }

        .books-section h3 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        hr {
            border: 0;
            border-top: 1px solid #eee;
            margin-bottom: 20px;
        }

        .section-info {
            text-align: left;
            font-size: 18px;
            color: #333;
            margin-bottom: 20px;
        }

        /* Lưới hiển thị sách - CHỈNH SỬA TẠI ĐÂY */
        .books-list {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center; /* Căn giữa các cuốn sách trong danh sách */
            flex-grow: 1; /* Để phần danh sách chiếm không gian còn lại */
        }

        .book-card-small {
            width: 130px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 10px;
        }

        .cover-box {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #fff;
            border: 1px solid #eee;
            border-radius: 20px;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }

        .mini-brand {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 22px;
            height: 22px;
            background: linear-gradient(#ffae3d, #ff7e01);
            border-radius: 6px;
            display: flex;
            justify-content: center; align-items: center;
            color: white; font-size: 12px;
        }

        .book-card-small span {
            font-size: 16px;
            font-weight: 600;
            color: #000;
        }

        .see-more {
            margin-top: 25px;
            display: block;
            color: var(--gray-text);
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
        }

        /* MODAL STYLES */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: #f4f4f6;
            border-radius: 28px;
            max-width: 420px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            z-index: 1001;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            background: #f0f0f0;
        }

        /* Book Cover Click Effect */
        .cover-box {
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .cover-box:hover {
            transform: translateY(-5px);
        }

        /* Table Styling */
        #borrowingTable tbody tr:hover {
            background-color: #f5f5f5;
            transition: background-color 0.2s ease;
        }

        #borrowingTable tbody tr {
            transition: background-color 0.2s ease;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <div class="header-left">
            <div class="logo-box">        
                <img src="https://daisy.org/wp-content/uploads/2020/07/apple-books-app-icon.png" alt="Library Logo" class="logo-box"/>
</div>
            <div style="margin-left: 15px; text-align: left;">
                <h2 style="font-size: 20px;">Library Management System</h2>
                <p style="color: #8c8c8c; font-size: 14px;">Member Dashboard</p>
            </div>
        </div>
        <a href="/logout" class="sign-out-btn">Sign out</a>
    </div>

    <nav class="nav-bar">
        <a href="/member/dashboard" class="nav-item">Overview</a>
        <a href="/member/browse-library" class="nav-item">Browse library</a>
        <a href="/member/my-books" class="nav-item active">My books</a>
        <a href="/member/profile" class="nav-item">Profile</a>
    </nav>

    <div class="my-books-grid">
        <section class="books-section">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <h3>Borrowing Books</h3>
                <button onclick="location.reload()" style="padding: 8px 16px; background: #007aff; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600;">🔄 Refresh</button>
            </div>
            <hr>
            <p class="section-info">Total Borrowed: <span id="borrowingCount">0</span> / 10</p>
            
            <div class="books-list" id="borrowingBooksList">
                <p style="text-align: center; color: #999; padding: 20px; width: 100%;">Loading...</p>
            </div>
            
            <table id="borrowingTable" style="width: 100%; border-collapse: collapse; text-align: left; display: none;">
                <thead style="background: #f5f5f5; border-bottom: 2px solid #e0e0e0;">
                    <tr>
                        <th style="padding: 12px; font-weight: 600;">Book Title</th>
                        <th style="padding: 12px; font-weight: 600;">Due Date</th>
                        <th style="padding: 12px; font-weight: 600;">Status</th>
                    </tr>
                </thead>
                <tbody id="borrowingTableBody"></tbody>
            </table>
            
            <a href="#" class="see-more">See more</a>
        </section>

        <section class="books-section">
            <h3>History</h3>
            <hr>
            <div style="height: 40px;"></div> 
            
            <div class="books-list" id="historyBooksList">
                <p style="grid-column: 1 / -1; text-align: center; color: #999; padding: 20px;">Loading...</p>
            </div>
        </section>
    </div>

    <!-- Book Detail Modal -->
    <div class="modal-overlay" id="bookModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeBookDetail()">✕</button>
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        // Server-side data passed from Flask
        const borrowingBooks = {{ borrowing_books | tojson }};
        const borrowHistory = {{ borrow_history | tojson }};

        // Display borrowed books on page load
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Page loaded, displaying book lists...');
            displayBorrowedBooks();
            displayBorrowHistory();
        });

        // Display borrowed books (currently borrowing)
        function displayBorrowedBooks() {
            console.log('=== DISPLAYING BORROWED BOOKS ===');
            console.log('Borrowed books data:', borrowingBooks);
            
            const container = document.getElementById('borrowingBooksList');
            const countSpan = document.getElementById('borrowingCount');
            
            if (borrowingBooks && borrowingBooks.length > 0) {
                console.log(`✅ Found ${borrowingBooks.length} borrowed books`);
                countSpan.textContent = borrowingBooks.length;
                
                // Display as cards (grid)
                container.style.display = 'flex';
                
                const cardsHTML = borrowingBooks.map((borrow, idx) => {
                    console.log(`Processing book ${idx + 1}:`, borrow.book_title);
                    const dueDate = new Date(borrow.due_date);
                    const today = new Date();
                    const isOverdue = dueDate < today;
                    const dueDateStr = dueDate.toLocaleDateString('vi-VN');
                    
                    return `
                        <div class="book-card-small">
                            <div class="cover-box" style="background: white; border: 1px solid #e5e7eb; border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 48px;">📖</div>
                            <div style="width: 100%; text-align: left;">
                                <span style="font-size: 14px; font-weight: 600; color: #000; display: block; margin-bottom: 4px; word-wrap: break-word;">${borrow.book_title || 'Unknown Book'}</span>
                                <span style="font-size: 12px; color: #666; display: block; margin-bottom: 4px;">Due: ${dueDateStr}</span>
                                <span style="font-size: 11px; padding: 3px 8px; border-radius: 12px; display: inline-block; ${
                                    isOverdue 
                                        ? 'background: #ffebee; color: #c62828;' 
                                        : 'background: #e8f5e9; color: #2e7d32;'
                                }">
                                    ${isOverdue ? '🔴 Overdue' : '✅ Active'}
                                </span>
                            </div>
                        </div>
                    `;
                }).join('');
                
                container.innerHTML = cardsHTML;
                console.log('Cards HTML rendered');
            } else {
                console.log(`❌ No books to display`);
                countSpan.textContent = '0';
                container.style.display = 'flex';
                container.innerHTML = '<p style="text-align: center; color: #999; padding: 20px; width: 100%;">No borrowed books</p>';
            }
        }

        // Display borrow history (all past borrows)
        function displayBorrowHistory() {
            console.log('=== DISPLAYING BORROW HISTORY ===');
            console.log('Borrow history data:', borrowHistory);
            
            const container = document.getElementById('historyBooksList');
            
            if (borrowHistory && borrowHistory.length > 0) {
                // Filter for RETURNED and OVERDUE only (exclude BORROWING and LATE)
                const historyBooks = borrowHistory.filter(b => 
                    b.status === 'RETURNED' || b.status === 'OVERDUE'
                );
                
                if (historyBooks.length > 0) {
                    console.log(`Found ${historyBooks.length} history books`);
                    
                    // Sort by borrow_date descending (most recent first)
                    historyBooks.sort((a, b) => new Date(b.borrow_date) - new Date(a.borrow_date));
                    
                    container.innerHTML = historyBooks.slice(0, 10).map(borrow => {
                        const returnDate = new Date(borrow.return_date);
                        const returnDateStr = returnDate.toLocaleDateString('vi-VN');
                        const isLate = borrow.status === 'OVERDUE';
                        
                        return `
                            <div class="book-card-small">
                                <div class="cover-box" style="background: white; border: 1px solid #e5e7eb; border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 48px;">📖</div>
                                <div style="width: 100%; text-align: left;">
                                    <span style="font-size: 14px; font-weight: 600; color: #000; display: block; margin-bottom: 4px; word-wrap: break-word;">${borrow.book_title || 'Unknown Book'}</span>
                                    <span style="font-size: 12px; color: #666; display: block; margin-bottom: 4px;">Returned: ${returnDateStr}</span>
                                    <span style="font-size: 11px; padding: 3px 8px; border-radius: 12px; display: inline-block; ${
                                        isLate 
                                            ? 'background: #fff3cd; color: #856404;' 
                                            : 'background: #d4edda; color: #155724;'
                                    }">
                                        ${isLate ? '⚠️ Late' : '✅ On Time'}
                                    </span>
                                </div>
                            </div>
                        `;
                    }).join('');
                } else {
                    container.innerHTML = '<p style="text-align: center; color: #999; padding: 20px; width: 100%;">No borrow history</p>';
                }
            } else {
                console.log('No history books found');
                container.innerHTML = '<p style="text-align: center; color: #999; padding: 20px; width: 100%;">No borrow history</p>';
            }
        }

        function openBookDetail(bookElement) {
            const bookName = bookElement.parentElement.querySelector('span').textContent;
            const modal = document.getElementById('bookModal');
            const modalContent = document.getElementById('modalContent');
            
            const bookDetails = `
                <div class="book-detail-container">
                    <h2>${bookName}</h2>
                    <p style="color: #666; font-size: 14px; margin: 10px 0;">By John Doe</p>
                    <p style="color: #888; font-size: 13px; margin: 10px 0; line-height: 1.6;">
                        This is a comprehensive book about modern software engineering practices and principles.
                    </p>
                    <div class="book-details-grid" style="margin: 20px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                        <div style="padding: 10px; background: #f5f5f5; border-radius: 8px;">
                            <p style="font-size: 12px; color: #888;">ISBN</p>
                            <p style="font-weight: 600;">978-3-16-148410</p>
                        </div>
                        <div style="padding: 10px; background: #f5f5f5; border-radius: 8px;">
                            <p style="font-size: 12px; color: #888;">Category</p>
                            <p style="font-weight: 600;">Technology</p>
                        </div>
                        <div style="padding: 10px; background: #f5f5f5; border-radius: 8px;">
                            <p style="font-size: 12px; color: #888;">Publisher</p>
                            <p style="font-weight: 600;">Tech Press</p>
                        </div>
                        <div style="padding: 10px; background: #f5f5f5; border-radius: 8px;">
                            <p style="font-size: 12px; color: #888;">Year</p>
                            <p style="font-weight: 600;">2024</p>
                        </div>
                        <div style="padding: 10px; background: #f5f5f5; border-radius: 8px;">
                            <p style="font-size: 12px; color: #888;">Status</p>
                            <p style="font-weight: 600;">Available</p>
                        </div>
                        <div style="padding: 10px; background: #f5f5f5; border-radius: 8px;">
                            <p style="font-size: 12px; color: #888;">Copies</p>
                            <p style="font-weight: 600;">5</p>
                        </div>
                    </div>
                    <button onclick="requestBorrow('${bookName}')" style="width: 100%; padding: 12px; margin-top: 15px; background-color: #0066cc; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;">
                        Request to borrow book
                    </button>
                </div>
            `;
            
            modalContent.innerHTML = bookDetails;
            modal.classList.add('active');
        }

        function closeBookDetail() {
            const modal = document.getElementById('bookModal');
            modal.classList.remove('active');
        }

        function requestBorrow(bookName) {
            alert(`Borrow request for "${bookName}" sent successfully!`);
            closeBookDetail();
        }

        // Close modal when clicking outside the modal content
        document.getElementById('bookModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeBookDetail();
            }
        });

        // Close modal when pressing Escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeBookDetail();
            }
        });
    </script>

</body>
</html>
