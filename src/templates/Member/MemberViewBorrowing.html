<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --white: #ffffff;
            --gray-text: #8c8c8c;
            --input-bg: #f3f4f6;
            --border-color: #e0e0e0;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }

        body {
            background-color: #f1f3f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Container chính của thẻ mượn sách */
        .borrow-card {
            background-color: var(--white);
            width: 450px;
            border-radius: 30px; /* Bo góc trung bình cho thẻ con */
            padding: 25px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        /* Phần Header: Logo, Tên sách và Nút View */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .book-info-top {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .mini-logo-circle {
            width: 50px;
            height: 50px;
            background: linear-gradient(#ffae3d, #ff7e01);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
        }

        .title-group h4 {
            font-size: 18px;
            font-weight: 700;
            color: #000;
        }

        .title-group p {
            font-size: 14px;
            color: var(--gray-text);
        }

        .view-details-btn {
            background: white;
            border: 1px solid var(--border-color);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        /* Phần thân: Hiển thị ngày tháng */
        .card-body-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .info-field label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #000;
        }

        .display-box {
            background-color: var(--input-bg);
            height: 35px;
            border-radius: 15px;
            width: 100%;
        }

        /* Phần chân: Thời gian còn lại */
        .remaining-field label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #000;
        }

        .remaining-box {
            background-color: var(--input-bg);
            height: 40px;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            font-weight: 600;
            color: var(--gray-text);
        }
    </style>
</head>
<body>

    <div class="borrow-card">
        <div class="card-header">
            <div class="book-info-top">
                <div class="mini-logo-circle">📖</div>
                <div class="title-group">
                    <h4>Book Name</h4>
                    <p>Author Name</p>
                </div>
            </div>
            <button class="view-details-btn">View details</button>
        </div>

        <div class="card-body-grid">
            <div class="info-field">
                <label>Day Borrowed</label>
                <div class="display-box"></div>
            </div>
            <div class="info-field">
                <label>Day Returned</label>
                <div class="display-box"></div>
            </div>
        </div>

        <div class="remaining-field">
            <label>Time Remaining</label>
            <div class="remaining-box">
                5 Days
            </div>
        </div>
    </div>

</body>
</html>
