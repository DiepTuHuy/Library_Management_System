
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System - My Book</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: #0b2a33; /* nền xanh đậm bên ngoài */
            padding: 30px;
            display: flex;
            justify-content: center;
        }

        /* ===== MAIN CONTAINER ===== */
        .container {
            width: 100%;
            max-width: 1100px;
            background: #ffffff;
            border-radius: 22px;
            padding: 35px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.15);
        }

        /* ===== BOOK CARD ===== */
        .book-card {
            display: flex;
            gap: 40px;
            align-items: flex-start;
        }

        /* LEFT SIDE */
        .book-left {
            display: flex;
            align-items: center;
            gap: 20px;
            flex: 1;
        }

        .book-icon {
            width: 72px;
            height: 72px;
            background: #ff9500;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            color: white;
        }

        .book-info h2 {
            font-size: 22px;
            font-weight: 700;
            color: #1c1c1e;
            margin-bottom: 6px;
        }

        .book-info p {
            font-size: 15px;
            color: #8e8e93;
        }

        /* RIGHT SIDE */
        .book-right {
            flex: 2;
        }

        .top-action {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 25px;
        }

        .view-btn {
            background: #ffffff;
            border: 1px solid #d1d1d6;
            padding: 10px 26px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        /* INFO GRID */
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px 35px;
        }

        .info-item label {
            display: block;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #1c1c1e;
        }

        .info-box {
            background: #f2f2f7;
            border-radius: 25px;
            padding: 14px 22px;
            font-size: 14px;
            color: #8e8e93;
        }

        .info-box.center {
            text-align: center;
            font-weight: 600;
            color: #6c6c70;
        }

        .full-width {
            grid-column: 1 / span 2;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 800px) {
            .book-card {
                flex-direction: column;
            }

            .top-action {
                justify-content: flex-start;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="book-card">

        <!-- LEFT -->
        <div class="book-left">
            <div class="book-icon">📖</div>
            <div class="book-info">
                <h2>Book Name</h2>
                <p>Author Name</p>
            </div>
        </div>

        <!-- RIGHT -->
        <div class="book-right">

            <div class="top-action">
                <button class="view-btn">View details</button>
            </div>

            <div class="info-grid">
                <div class="info-item">
                    <label>Day Borrowed</label>
                    <div class="info-box"></div>
                </div>

                <div class="info-item">
                    <label>Day Returned</label>
                    <div class="info-box"></div>
                </div>

                <div class="info-item full-width">
                    <label>Time Remaining</label>
                    <div class="info-box center">5 Days</div>
                </div>
            </div>

        </div>

    </div>

</div>

</body>
</html>
